# nginx config for ratethat.tennis frontend
# SPA routing: all unknown paths fall back to index.html so React Router works
# API proxy: /api/* and /health are forwarded server-side to the FastAPI backend
#            This avoids CORS entirely — the browser only ever talks to this domain.

server {
    listen $PORT;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1000;

    # Proxy all /api/* requests to the FastAPI backend (server-side — no CORS)
    location /api/ {
        proxy_pass https://rate-that-tennis-production.up.railway.app/api/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host rate-that-tennis-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy /health to the backend too
    location /health {
        proxy_pass https://rate-that-tennis-production.up.railway.app/health;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host rate-that-tennis-production.up.railway.app;
    }

    # Dynamic sitemap — proxy to FastAPI so it can query the DB for match/player URLs
    location = /sitemap.xml {
        proxy_pass https://rate-that-tennis-production.up.railway.app/sitemap.xml;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host rate-that-tennis-production.up.railway.app;
        add_header Cache-Control "public, max-age=3600";
    }

    # Proxy /admin/* to the FastAPI backend (admin endpoints)
    location /admin/ {
        proxy_pass https://rate-that-tennis-production.up.railway.app/admin/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host rate-that-tennis-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Cache static assets aggressively (Vite generates hashed filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — React Router handles all routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Health check endpoint for Railway (frontend itself)
    location /ping {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
