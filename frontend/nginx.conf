# nginx config for ratethat.tennis frontend
# SPA routing: all unknown paths fall back to index.html so React Router works
# API proxy: /api/* and /health are forwarded server-side to the FastAPI backend
#            This avoids CORS entirely — the browser only ever talks to this domain.
# Bot detection: known crawlers are routed to FastAPI SSR endpoints so Google
#                indexes real content rather than an empty React shell.

# Map common search-engine and social-media crawler User-Agents
map $http_user_agent $is_crawler {
    default                 0;
    "~*googlebot"           1;
    "~*bingbot"             1;
    "~*slurp"               1;
    "~*duckduckbot"         1;
    "~*baiduspider"         1;
    "~*yandexbot"           1;
    "~*facebot"             1;
    "~*ia_archiver"         1;
    "~*twitterbot"          1;
    "~*linkedinbot"         1;
    "~*whatsapp"            1;
    "~*slackbot"            1;
    "~*discordbot"          1;
    "~*telegrambot"         1;
    "~*AhrefsBot"           1;
    "~*SemrushBot"          1;
}

server {
    listen $PORT;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1000;

    # Proxy all /api/* requests to the FastAPI backend (server-side — no CORS)
    location /api/ {
        proxy_pass https://rate-that-tennis-production.up.railway.app/api/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host rate-that-tennis-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy /health to the backend too
    location /health {
        proxy_pass https://rate-that-tennis-production.up.railway.app/health;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host rate-that-tennis-production.up.railway.app;
    }

    # Dynamic sitemap — proxy to FastAPI so it can query the DB for match/player URLs
    location = /sitemap.xml {
        proxy_pass https://rate-that-tennis-production.up.railway.app/sitemap.xml;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host rate-that-tennis-production.up.railway.app;
        add_header Cache-Control "public, max-age=3600";
    }

    # Proxy /admin/* to the FastAPI backend (admin endpoints)
    location /admin/ {
        proxy_pass https://rate-that-tennis-production.up.railway.app/admin/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host rate-that-tennis-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Cache static assets aggressively (Vite generates hashed filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Match pages — crawlers get SSR HTML from FastAPI ─────────────────
    location ~* ^/match/ {
        error_page 418 = @crawler_ssr_match;
        if ($is_crawler) { return 418; }
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # ── Player pages — crawlers get SSR HTML from FastAPI ─────────────────
    location ~* ^/player/ {
        error_page 418 = @crawler_ssr_player;
        if ($is_crawler) { return 418; }
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # Named location: proxy match bots to /seo/match/{id}
    location @crawler_ssr_match {
        # Strip slug from URL — FastAPI only needs /seo/match/{id}
        rewrite ^/match/(\d+)(/.*)?$ /seo/match/$1 break;
        proxy_pass https://rate-that-tennis-production.up.railway.app;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host rate-that-tennis-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_valid 200 1h;
    }

    # Named location: proxy player bots to /seo/player/{id}
    location @crawler_ssr_player {
        rewrite ^/player/(\d+)(/.*)?$ /seo/player/$1 break;
        proxy_pass https://rate-that-tennis-production.up.railway.app;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host rate-that-tennis-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_valid 200 1h;
    }

    # SPA fallback — React Router handles all other routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Health check endpoint for Railway (frontend itself)
    location /ping {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
